services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - public_assets:/var/www/html/public
      - storage_data:/var/www/html/storage
    networks:
      - quickbuy_network

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - quickbuy_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - quickbuy_network

volumes:
  db_data:
  public_assets:
  storage_data:

networks:
  quickbuy_network:
    driver: bridge
